plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':refdiff-core')
    implementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.16.0'

    implementation("io.github.bonede:tree-sitter:0.22.6")
    implementation("io.github.bonede:tree-sitter-java:0.23.4")
    implementation("io.github.bonede:tree-sitter-c:0.23.2")
    implementation("io.github.bonede:tree-sitter-javascript:0.23.1")
    implementation("io.github.bonede:tree-sitter-ruby:0.23.1")
    implementation("io.github.bonede:tree-sitter-go:0.23.3")
    implementation("io.github.bonede:tree-sitter-python:0.23.4")
    implementation("io.github.bonede:tree-sitter-php:0.23.11")
    implementation("io.github.bonede:tree-sitter-typescript:0.23.2")

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.3.4'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.3.4'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.3.4'
    implementation 'org.json:json:20231013'

    testImplementation 'junit:junit:4.11' // TODO remove this line after migrating all tests to JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testImplementation project(path: ':refdiff-core', configuration: 'testArtifacts')
}

tasks.withType(Test) {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}
